name: Aero Lab regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: motorsport_aero_project/requirements-web.txt
      - run: pip install -r requirements-web.txt pytest
        working-directory: motorsport_aero_project
      - run: python -m pytest tests/test_web.py tests/test_efficiency.py tests/test_dynamic_api.py tests/test_comparison.py -q
        working-directory: motorsport_aero_project
